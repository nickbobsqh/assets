<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160b2c">
  <title>SNACKDrive</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #160b2c;
      --orange: #ff963d;
      --orange-bright: #ffad5c;
      --text: #f7f0ff;
      --muted: #b9a9ce;
      --glass: rgba(255,255,255,.075);
      --glass-strong: rgba(255,255,255,.11);
      --line: rgba(255,255,255,.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(123,65,190,.30), transparent 38rem),
        radial-gradient(ellipse at 88% 30%, rgba(255,132,45,.13), transparent 30rem),
        linear-gradient(145deg, #10071f, var(--bg) 55%, #21103b);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      z-index: -1;
    }
    .shell { width: min(1100px, calc(100% - 36px)); margin: 0 auto; padding: 52px 0 70px; }
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      box-shadow: 0 24px 80px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 260px; height: 260px;
      right: -85px; top: -150px;
      border-radius: 50%;
      background: rgba(255,150,61,.17);
      filter: blur(8px);
      pointer-events: none;
    }
    .logo-wrap {
      width: 88px; height: 88px; flex: 0 0 88px;
      display: grid; place-items: center;
      border-radius: 24px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.17);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
      overflow: hidden;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .logo-fallback { color: var(--orange); font-size: 27px; font-weight: 900; letter-spacing: -2px; }
    h1 { margin: 0; font-size: clamp(2.1rem, 6vw, 3.8rem); line-height: 1; letter-spacing: -.065em; }
    h1 span { color: var(--orange); }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.55; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin: 28px 0 22px; }
    .search {
      width: 100%; min-width: 0; padding: 14px 17px;
      color: var(--text); font: inherit; outline: none;
      border: 1px solid var(--line); border-radius: 15px;
      background: rgba(255,255,255,.065);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(16px);
    }
    .search::placeholder { color: #9f8db7; }
    .search:focus { border-color: rgba(255,150,61,.65); box-shadow: 0 0 0 3px rgba(255,150,61,.12); }
    .status { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    #content { display: grid; gap: 22px; }
    .category {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: var(--glass);
      box-shadow: 0 18px 55px rgba(0,0,0,.17), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }
    .category-heading { display: flex; align-items: center; gap: 11px; margin: 0 0 16px; font-size: 1.12rem; }
    .category-heading::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 16px rgba(255,150,61,.7); }
    .count { margin-left: auto; color: var(--muted); font-size: .78rem; font-weight: 500; }
    .drive-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 12px; }
    .drive {
      min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 15px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.045);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .drive:hover { transform: translateY(-2px); background: var(--glass-strong); border-color: rgba(255,150,61,.3); }
    .drive-name { min-width: 0; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    .open-btn {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 13px; border: 0; border-radius: 11px;
      color: #24112f; background: linear-gradient(135deg, var(--orange-bright), var(--orange));
      font: inherit; font-size: .86rem; font-weight: 800; text-decoration: none;
      box-shadow: 0 5px 18px rgba(255,135,49,.2);
      transition: transform .18s ease, filter .18s ease;
    }
    .open-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .open-btn:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .empty, .error {
      padding: 28px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: 18px; background: rgba(255,255,255,.035);
    }
    .error { color: #ffc3a1; }
    footer { margin-top: 30px; text-align: center; color: #88779f; font-size: .8rem; }
    @media (max-width: 600px) {
      .shell { width: min(100% - 24px, 1100px); padding-top: 24px; }
      .hero { align-items: flex-start; gap: 16px; padding: 21px; border-radius: 22px; }
      .logo-wrap { width: 62px; height: 62px; flex-basis: 62px; border-radius: 17px; }
      .subtitle { font-size: .9rem; }
      .toolbar { margin-top: 20px; flex-wrap: wrap; }
      .status { padding-left: 2px; }
      .category { padding: 17px; }
      .drive { padding: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="logo-wrap">
        <img src="logo.png" alt="SNACK Dubbing Group logo" onerror="this.style.display='none'; this.nextElementSibling.hidden=false">
        <span class="logo-fallback" hidden>SNACK</span>
      </div>
      <div>
        <h1><span>SNACK</span>Drive</h1>
        <p class="subtitle">Links to useful Google Drives used by the SNACK Dubbing Group</p>
      </div>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search drives or categories…" aria-label="Search drives or categories">
      <div class="status" id="status" aria-live="polite">Loading drives…</div>
    </div>

    <section id="content" aria-live="polite">
      <div class="empty">Loading the SNACKDrive library…</div>
    </section>
    <footer>SNACKDrive · SNACK Dubbing Group</footer>
  </main>

  <script>
    const DRIVE_FILE = "./drives.txt";
    const content = document.getElementById("content");
    const search = document.getElementById("search");
    const status = document.getElementById("status");
    let drives = [];

    function parseDrives(text) {
      const entries = [];
      let category = "Uncategorized";
      let name = "";
      let link = "";

      function save() {
        if (name && link) entries.push({ category, name, link });
        name = "";
        link = "";
      }

      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith("//")) continue;
        if (line.startsWith("$")) {
          save();
          category = line.slice(1).trim() || "Uncategorized";
        } else if (line.startsWith("#")) {
          save();
          name = line.slice(1).trim();
        } else if (line.startsWith("@")) {
          link = line.slice(1).trim();
          save();
        }
      }
      save();
      return entries.filter(item => {
        try {
          const url = new URL(item.link);
          return url.protocol === "https:" || url.protocol === "http:";
        } catch { return false; }
      });
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = drives.filter(d =>
        d.name.toLowerCase().includes(query) || d.category.toLowerCase().includes(query)
      );
      const groups = new Map();
      for (const drive of filtered) {
        if (!groups.has(drive.category)) groups.set(drive.category, []);
        groups.get(drive.category).push(drive);
      }

      status.textContent = `${filtered.length} ${filtered.length === 1 ? "drive" : "drives"}`;
      if (!filtered.length) {
        content.innerHTML = `<div class="empty">${drives.length ? "No drives match your search." : "No drives found in drives.txt yet."}</div>`;
        return;
      }

      content.innerHTML = "";
      for (const [category, items] of groups) {
        const section = document.createElement("section");
        section.className = "category";
        const heading = document.createElement("h2");
        heading.className = "category-heading";
        heading.append(document.createTextNode(category));
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = `${items.length} ${items.length === 1 ? "drive" : "drives"}`;
        heading.append(count);

        const list = document.createElement("div");
        list.className = "drive-list";
        for (const item of items) {
          const card = document.createElement("article");
          card.className = "drive";
          const title = document.createElement("div");
          title.className = "drive-name";
          title.textContent = item.name;
          const button = document.createElement("a");
          button.className = "open-btn";
          button.href = item.link;
          button.target = "_blank";
          button.rel = "noopener noreferrer";
          button.textContent = "Open ↗";
          button.setAttribute("aria-label", `Open ${item.name} in a new tab`);
          card.append(title, button);
          list.append(card);
        }
        section.append(heading, list);
        content.append(section);
      }
    }

    async function loadDrives() {
      try {
        const response = await fetch(DRIVE_FILE, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        drives = parseDrives(await response.text());
        render();
      } catch (error) {
        console.error("Could not load drives.txt:", error);
        status.textContent = "Could not load";
        content.innerHTML = `<div class="error">Couldn't load drives.txt. Check that the file exists at the configured GitHub URL and that the repository allows public access.</div>`;
      }
    }

    search.addEventListener("input", render);
    loadDrives();
  </script>
</body>
</html>
